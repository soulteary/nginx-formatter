name: Go Report Card

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: grc
        uses: soulteary/goreportcard-action@v1.0.0
        with:
          directory: "."
          output: ".github/goreportcard.svg"
          commit: "true"
      - run: echo "Grade ${{ steps.grc.outputs.grade }} (${{ steps.grc.outputs.score }}%)"

name: Codecov

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  CodeCov:
    runs-on: ubuntu-latest

    env:
      GO111MODULE: on
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod


      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Vet
        run: go vet ./...

      - name: Run coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      # The WebUI serves concurrent requests, so the race detector is the check
      # that matters most here; it is a separate run because -race is
      # incompatible with the atomic cover mode above.
      - name: Race detector
        run: go test -race ./...

      # FuzzParseFormat asserts the two properties a formatter must hold:
      # its output re-parses, and formatting is a fixed point. It found the
      # unterminated-quote and trailing-backslash non-convergence bugs in
      # seconds, so it earns a short run on every push rather than only
      # being available to whoever remembers to invoke it.
      - name: Fuzz the parse/format round trip
        run: go test ./internal/nginx -run '^$' -fuzz=FuzzParseFormat -fuzztime=60s

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}